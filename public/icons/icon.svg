<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#121110"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA822A"/>
      <stop offset="100%" stop-color="#7A5816"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA822A"/>
      <stop offset="50%" stop-color="#E8D196"/>
      <stop offset="100%" stop-color="#FFF2D1"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Golden Quill Monogram Emblem -->
  <g transform="translate(106, 106) scale(2.5)" filter="url(#goldGlow)">
    <!-- Serif 'M' Letter Left Stems -->
    <path d="M18 96V32H28L46 72L50 64L32 24H10V32H16V96H10V104H32V96H24V42L44 86H50L56 72L36 32V96H18Z" fill="url(#goldGrad)" />
    
    <!-- Feather Quill sweeping through M -->
    <path d="M42 98C46 88 52 74 58 58C64 42 74 24 88 12C85 24 82 38 78 52C74 66 68 80 62 92C58 100 50 106 42 108C40 108 40 104 42 98Z" fill="url(#featherGrad)" />
    
    <!-- Quill Vanes Lines -->
    <path d="M62 40C68 34 76 28 84 22M58 54C66 48 74 42 80 36M54 68C60 62 68 56 74 50M50 82C56 76 62 70 68 64" stroke="#7A5816" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    
    <!-- Serif 'H' Letter Right Stems -->
    <path d="M74 104H96V96H90V70H108V96H102V104H124V96H118V32H124V24H102V32H108V62H90V32H96V24H74V32H80V96H74V104Z" fill="url(#goldGrad)" />
  </g>

  <!-- Subtext -->
  <text x="256" y="440" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">MANUSCRIPT HEAVEN</text>
</svg>