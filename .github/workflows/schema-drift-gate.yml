name: Schema Drift Gate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Environment whose migration ledger must exactly match this commit
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  remote-parity:
    name: Exact remote migration parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Select target safely
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET=production
          else
            TARGET="${{ inputs.target }}"
          fi

          if [ "$TARGET" = "staging" ]; then
            PROJECT_REF="atazylptnaonohucldfg"
            DB_PASSWORD="$STAGING_DB_PASSWORD"
          elif [ "$TARGET" = "production" ]; then
            PROJECT_REF="emhvwdhdmajpakoscuyn"
            DB_PASSWORD="$PRODUCTION_DB_PASSWORD"
          else
            echo "Unsupported target: $TARGET" >&2
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Required Supabase access/database secrets are not configured." >&2
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
          echo "db_password=$DB_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Link read-only parity target
        run: supabase link --project-ref "${{ steps.target.outputs.project_ref }}" --password "${{ steps.target.outputs.db_password }}"

      - name: Compare exact migration ledger
        shell: bash
        run: |
          supabase migration list --linked > /tmp/remote-migrations.txt
          cat /tmp/remote-migrations.txt
          node scripts/check-migration-drift.mjs /tmp/remote-migrations.txt --column remote

      - name: Gate summary
        run: echo "${{ steps.target.outputs.target }} migration history exactly matches the repository."
