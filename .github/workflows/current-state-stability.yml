name: Current State Stability Gate

on:
  push:
    branches:
      - main
      - feature/task-management-v2
      - integration/current-state-stabilization-20260918
      - feat/attendance-daily-ledger-foundation
  pull_request:
    branches:
      - feature/task-management-v2
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full regression suite
        run: pnpm test
      - name: Parse staging messaging E2E runner without credentials
        run: node --check scripts/messaging-staging-e2e.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and production build
        run: pnpm run build

  attendance-ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: attendance_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: attendance_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql is installed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply test-only Supabase authorization fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-fixture.sql
      - name: Execute PR migration on disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021080547_attendance_daily_credits_v2_20261019.sql
      - name: Verify ledger authorization and runtime invariants
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-tests.sql
      - name: Apply legacy attendance credit compatibility hotfix
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021084024_attendance_daily_legacy_credit_compat.sql
      - name: Verify legacy heartbeat compatibility and overlap security
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-legacy-credit-ci-tests.sql
      - name: Apply append-only admin reconciliation schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021080615_attendance_admin_reconciliation_v2_20261020.sql
      - name: Verify admin-only corrections evidence and immutable audit
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-reconciliation-ci-tests.sql

  task-incentive-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: task_incentive_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: task_incentive_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql exists
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable authorization and payroll fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/task-incentive-ci-fixture.sql
      - name: Apply exact task incentive migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261025114000_task_incentive_payroll.sql
      - name: Verify all five roles and payroll idempotency
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/task-incentive-ci-tests.sql

  project-attachment-rls-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: project_attachment_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: project_attachment_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - name: Set up disposable Supabase authorization fixture
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/project-attachment-ci-fixture.sql
      - name: Apply exact staff attachment RLS migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023220000_staff_project_initial_attachments.sql
      - name: Verify privileged and restricted user writes
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/project-attachment-ci-tests.sql

  ai-knowledge-rls-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: knowledge_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: knowledge_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - name: Initialize production-equivalent knowledge policies in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/ai-knowledge-rls-fixture.sql
      - name: Apply exact AI security migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030001000_ai_knowledge_admin_boundary.sql
      - name: Assert role-based SELECT INSERT UPDATE DELETE isolation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/ai-knowledge-rls-tests.sql

  ai-task-workflow-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai_workflow_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ai_workflow_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable roles and task security fixture
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/ai-task-workflow-ci-fixture.sql
      - name: Apply exact assignment notification migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030201500_task_assignment_notification_certification.sql
      - name: Verify end-to-end inserts, notifications, audit, and role restrictions
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/ai-task-workflow-ci-tests.sql
