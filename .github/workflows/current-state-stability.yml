name: Current State Stability Gate

on:
  push:
    branches:
      - main
      - feature/task-management-v2
      - integration/current-state-stabilization-20260918
      - feat/attendance-daily-ledger-foundation
  pull_request:
    branches:
      - feature/task-management-v2
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full regression suite
        run: pnpm test
      - name: Parse staging messaging E2E runner without credentials
        run: node --check scripts/messaging-staging-e2e.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and production build
        run: pnpm run build

  attendance-ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: attendance_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: attendance_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql is installed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply test-only Supabase authorization fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-fixture.sql
      - name: Execute PR migration on disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021080547_attendance_daily_credits_v2_20261019.sql
      - name: Verify ledger authorization and runtime invariants
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-tests.sql
      - name: Apply legacy attendance credit compatibility hotfix
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021084024_attendance_daily_legacy_credit_compat.sql
      - name: Verify legacy heartbeat compatibility and overlap security
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-legacy-credit-ci-tests.sql
      - name: Apply append-only admin reconciliation schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261021080615_attendance_admin_reconciliation_v2_20261020.sql
      - name: Verify admin-only corrections evidence and immutable audit
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-reconciliation-ci-tests.sql

  deploy-cloudflare-production:
    # Production releases only follow ALL successful tests on a main push.
    # PRs never receive production credentials or deploy previews.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [regression, build, attendance-ledger-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: mh-tracker-cloudflare-production
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: https://emhvwdhdmajpakoscuyn.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '46960ac6c9b58d562d6bc646f3b6b318' }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Cloudflare Pages:Edit permission and set it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_ANON_KEY. Set the public Supabase anon/publishable key under repository Actions secrets before deploying."
            exit 1
          fi
      - name: Checkout certified main
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production assets with real Supabase connection
        run: pnpm run build
      - name: Publish certified build to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '46960ac6c9b58d562d6bc646f3b6b318' }}
          command: pages deploy dist --project-name=mh-tracker --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record production deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Production site: https://mh-tracker.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
