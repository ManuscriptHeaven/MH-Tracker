name: Current State Stability Gate

on:
  push:
    branches:
      - main
      - feature/task-management-v2
      - integration/current-state-stabilization-20260918
  pull_request:
    branches:
      - feature/task-management-v2
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full regression suite
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and production build
        run: pnpm run build

  attendance-ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: attendance_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: attendance_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql is installed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply test-only Supabase authorization fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-fixture.sql
      - name: Execute PR migration on disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261019000100_attendance_daily_credits.sql
      - name: Verify ledger authorization and runtime invariants
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-ledger-ci-tests.sql
      - name: Apply append-only admin reconciliation schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000100_attendance_admin_reconciliation.sql
      - name: Verify admin-only corrections evidence and immutable audit
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql/attendance-reconciliation-ci-tests.sql
