name: Runtime Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static regression + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  database-runtime:
    name: Local Supabase DB + RLS + browser runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start disposable Supabase
        run: supabase start

      - name: Rebuild database from authoritative migrations
        run: supabase db reset

      - name: Export local runtime credentials
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "API_URL=$API_URL"
            echo "ANON_KEY=$ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_BASE_URL=http://127.0.0.1:4173"
          } >> "$GITHUB_ENV"

      - name: Exact local migration ledger parity
        shell: bash
        run: |
          supabase migration list --local > /tmp/migration-list.txt
          cat /tmp/migration-list.txt
          node scripts/check-migration-drift.mjs /tmp/migration-list.txt --column local

      - name: Database lint
        run: supabase db lint --level error

      - name: pgTAP runtime schema certification
        run: supabase test db supabase/tests/ci

      - name: Auth, RLS, Realtime and database integration certification
        run: node scripts/runtime-integration-certification.mjs

      - name: Install Playwright runtime dependency
        run: npm install --no-save --package-lock=false @playwright/test@1.58.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite against disposable Supabase
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mh-vite.log 2>&1 &
          echo $! > /tmp/mh-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mh-vite.log
          exit 1

      - name: Playwright browser certification
        run: npx playwright test e2e/runtime-certification.spec.ts

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-certification-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/mh-vite.log
          if-no-files-found: ignore

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
